<div class="flex flex-col items-center text-center space-y-space-xs">
<div class="w-20 h-20 rounded-2xl overflow-hidden shadow-md flex items-center justify-center"><img src="https://lh3.googleusercontent.com/aida/AEtjO1Un29XnTfSg2rUTgfY1Yc-cqicqYWuoylon4knIomhLaSFA5qlLmJGmPIWFkuhueQXLOpGvk70i7OmCllacD0l2nDpXk-ChrCxwYCJegkciKIyVCovU2rcK8O4NQFt5UohN4we-0J2dgKn-ocBJV3qD1Kdh2_ODMYJURUPtwf70FmL9munqpUC1nF1mrAOegc_y9q0NzonJJQ0vSfcuRDPQnPNbtPAmIjYChDI9jgmuom7lgH1PONmXKvs" alt="PrepUp AI Logo" class="w-full h-full object-cover"></div>

</div>

<div class="flex items-center space-x-space-sm p-4 rounded-xl bg-error-container text-on-error-container shadow-sm">
<span class="material-symbols-outlined text-2xl flex-shrink-0" style="font-variation-settings: &quot;FILL&quot; 1;">error</span>

</div>
<!-- Form Fields -->
<form class="flex flex-col space-y-space-md" onsubmit="event.preventDefault();">
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface">Email</label>
<input class="h-[60px] px-4 rounded-xl bg-surface-container-low font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" placeholder="Enter your email address" type="email">
</div>
<div class="flex flex-col space-y-space-xs relative">
<label class="font-label-md text-label-md text-on-surface">Password</label>
<div class="relative flex items-center">
<input class="w-full h-[60px] pl-4 pr-14 rounded-xl bg-surface-container-low font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" id="password-input" placeholder="Enter your password" type="password">
<button class="absolute right-3 w-12 h-12 flex items-center justify-center text-outline hover:text-on-surface focus:outline-none" onclick="togglePassword()" type="button">

</button>
</div>
</div>
<!-- Primary Button -->
<button class="w-full h-[60px] rounded-xl bg-primary text-on-primary font-body-lg text-body-lg flex items-center justify-center shadow-lg active:scale-[0.98] transition-transform" type="submit">

</form>
<!-- Text Link -->
<div class="flex justify-center">

</div>

<div class="flex flex-col space-y-space-sm pt-space-xs">

    </button>
<button class="w-full h-[60px] rounded-xl text-on-tertiary-container font-body-lg text-body-lg flex items-center justify-center space-x-space-xs shadow-sm active:scale-[0.98] transition-transform bg-primary-container" type="button">

</button>
</div>
</div>
<script>
  function togglePassword() {
    const passwordInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('eye-icon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }
</script></main></body></html>
