<!DOCTYPE html>

<html lang="en" style=""><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"on-tertiary-fixed-variant": "#6e3900", "surface-variant": "#e1e3e4", "tertiary-fixed-dim": "#ffb77d", "error": "#ba1a1a", "surface-container-lowest": "#ffffff", "secondary": "#006e2d", "surface-container-low": "#f3f4f5", "primary": "#004ac6", "surface-bright": "#f8f9fa", "primary-container": "#2563eb", "on-surface-variant": "#434655", "on-primary-fixed": "#00174b", "on-secondary": "#ffffff", "inverse-surface": "#2e3132", "on-primary": "#ffffff", "secondary-container": "#7cf994", "on-background": "#191c1d", "secondary-fixed": "#7ffc97", "tertiary-container": "#a65900", "on-secondary-container": "#007230", "secondary-fixed-dim": "#62df7d", "error-container": "#ffdad6", "on-primary-fixed-variant": "#003ea8", "outline-variant": "#c3c6d7", "on-error-container": "#93000a", "primary-fixed": "#dbe1ff", "inverse-primary": "#b4c5ff", "outline": "#737686", "on-surface": "#191c1d", "primary-fixed-dim": "#b4c5ff", "tertiary-fixed": "#ffdcc3", "on-tertiary": "#ffffff", "surface": "#f8f9fa", "surface-container-high": "#e7e8e9", "on-tertiary-fixed": "#2f1500", "surface-container": "#edeeef", "on-tertiary-container": "#ffede1", "on-secondary-fixed-variant": "#005320", "background": "#f8f9fa", "surface-container-highest": "#e1e3e4", "tertiary": "#824500", "surface-tint": "#0053db", "surface-dim": "#d9dadb", "on-error": "#ffffff", "inverse-on-surface": "#f0f1f2", "on-secondary-fixed": "#002109", "on-primary-container": "#eeefff"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {"space-md": "1.5rem", margin: "1rem", "space-lg": "2rem", "space-xl": "3rem", gutter: "1.5rem", "space-sm": "1rem", "space-xs": "0.5rem"}, fontFamily: {"label-md": ["Inter"], "body-md": ["Inter"], "headline-xl": ["Inter"], "body-lg": ["Inter"], "headline-lg": ["Inter"]}, fontSize: {"label-md": ["16px", {lineHeight: "24px", fontWeight: "700"}], "body-md": ["18px", {lineHeight: "28px", fontWeight: "700"}], "headline-xl": ["28px", {lineHeight: "36px", fontWeight: "800"}], "body-lg": ["20px", {lineHeight: "32px", fontWeight: "700"}], "headline-lg": ["24px", {lineHeight: "32px", fontWeight: "800"}]}}}};</script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head><body class="bg-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface flex-grow"><div class="flex flex-col w-full px-space-md py-space-md space-y-space-lg mb-24">
<!-- Header Section -->
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between">
<h1 class="font-headline-xl text-headline-xl text-on-background">Choose Subject</h1>
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center text-primary shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">neurology</span>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">Select your exam subject and length</p>
</div>
<!-- Step 1 - Select Subject -->
<div class="flex flex-col space-y-space-sm">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-primary tracking-wider uppercase">Step 1 of 2</span>
<span class="text-sm font-semibold text-outline">5 Subjects Available</span>
</div>
<div class="flex flex-col space-y-space-sm">
<!-- Subject 1: Mathematics -->
<button class="w-full flex items-center justify-between p-space-md bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-200 active:scale-95 group text-left" onclick="selectSubject(this)" type="button">
<div class="flex items-center space-x-space-md">
<div class="w-14 h-14 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-3xl">calculate</span>
</div>
<div>
<span class="block font-headline-lg text-headline-lg text-on-background">Mathematics</span>
<span class="block font-body-md text-body-md text-outline">General WAEC &amp; JAMB</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</div>
</button>
<!-- Subject 2: English Language -->
<button class="w-full flex items-center justify-between p-space-md bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-200 active:scale-95 group text-left" onclick="selectSubject(this)" type="button">
<div class="flex items-center space-x-space-md">
<div class="w-14 h-14 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-3xl">menu_book</span>
</div>
<div>
<span class="block font-headline-lg text-headline-lg text-on-background">English Language</span>
<span class="block font-body-md text-body-md text-outline">Use of English</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</div>
</button>
<!-- Subject 3: Physics -->
<button class="w-full flex items-center justify-between p-space-md bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-200 active:scale-95 group text-left" onclick="selectSubject(this)" type="button">
<div class="flex items-center space-x-space-md">
<div class="w-14 h-14 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-3xl">bolt</span>
</div>
<div>
<span class="block font-headline-lg text-headline-lg text-on-background">Physics</span>
<span class="block font-body-md text-body-md text-outline">Mechanics &amp; Waves</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</div>
</button>
<!-- Subject 4: Chemistry (Selected) -->
<button class="w-full flex items-center justify-between p-space-md bg-primary-fixed/20 rounded-xl shadow-md transition-all duration-200 active:scale-95 group text-left ring-2 ring-primary" onclick="selectSubject(this)" type="button">
<div class="flex items-center space-x-space-md">
<div class="w-14 h-14 rounded-xl bg-primary text-on-primary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">science</span>
</div>
<div>
<span class="block font-headline-lg text-headline-lg text-on-background">Chemistry</span>
<span class="block font-body-md text-body-md text-primary font-semibold">Organic &amp; Inorganic</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</button>
<!-- Subject 5: Biology -->
<button class="w-full flex items-center justify-between p-space-md bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-200 active:scale-95 group text-left" onclick="selectSubject(this)" type="button">
<div class="flex items-center space-x-space-md">
<div class="w-14 h-14 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-3xl">biotech</span>
</div>
<div>
<span class="block font-headline-lg text-headline-lg text-on-background">Biology</span>
<span class="block font-body-md text-body-md text-outline">Anatomy &amp; Ecology</span>
</div>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-xl">chevron_right</span>
</div>
</button>
</div>
</div>
<!-- Step 2 - How Many Questions? -->
<div class="flex flex-col space-y-space-sm">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-primary tracking-wider uppercase">Step 2 of 2</span>
<span class="text-sm font-semibold text-outline">Duration: ~15 mins</span>
</div>
<div class="grid grid-cols-2 gap-space-sm">
<!-- 10 Questions (Selected) -->
<button class="question-btn flex flex-col items-center justify-center p-space-md bg-primary-fixed/20 rounded-xl shadow-md transition-all duration-200 active:scale-95 ring-2 ring-primary text-center space-y-2" onclick="selectQuestions(this)" type="button">
<div class="w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
<div>
<span class="block font-headline-xl text-headline-xl text-on-background">10</span>
<span class="block font-body-md text-body-md text-primary font-semibold">Questions</span>
</div>
</button>
<!-- 20 Questions -->
<button class="question-btn flex flex-col items-center justify-center p-space-md bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-200 active:scale-95 text-center space-y-2" onclick="selectQuestions(this)" type="button">
<div class="w-12 h-12 rounded-full bg-surface-container text-outline flex items-center justify-center">
<span class="material-symbols-outlined text-2xl">timer</span>
</div>
<div>
<span class="block font-headline-xl text-headline-xl text-on-background">20</span>
<span class="block font-body-md text-body-md text-outline">Questions</span>
</div>
</button>
</div>
</div>
<!-- Bottom Pinned Action -->
<div class="fixed bottom-0 left-0 w-full p-space-md bg-surface/90 backdrop-blur-md z-50 shadow-lg">
<div class="max-w-md mx-auto">
<button class="w-full h-[60px] bg-secondary hover:bg-secondary/90 text-on-secondary rounded-2xl shadow-xl flex items-center justify-center space-x-space-sm transition-all duration-200 active:scale-98" type="button">
<span class="font-headline-lg text-headline-lg text-on-secondary">START TEST NOW</span>
<span class="material-symbols-outlined text-3xl animate-pulse">arrow_forward</span>
</button>
</div>
</div>
</div>
<script>
  function selectSubject(btn) {
    const allButtons = btn.parentElement.children;
    for (let b of allButtons) {
      b.className = "w-full flex items-center justify-between p-space-md bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-200 active:scale-95 group text-left";
      const iconBox = b.querySelector('.w-14');
      iconBox.className = "w-14 h-14 rounded-xl bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors";
      
      const subText = b.querySelector('span:nth-child(2)');
      if(subText) subText.className = "block font-body-md text-body-md text-outline";
      
      const rightIcon = b.querySelector('.w-8');
      rightIcon.className = "w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-outline";
      rightIcon.innerHTML = '<span class="material-symbols-outlined text-xl">chevron_right</span>';
    }
    
    btn.className = "w-full flex items-center justify-between p-space-md bg-primary-fixed/20 rounded-xl shadow-md transition-all duration-200 active:scale-95 group text-left ring-2 ring-primary";
    const activeIconBox = btn.querySelector('.w-14');
    activeIconBox.className = "w-14 h-14 rounded-xl bg-primary text-on-primary flex items-center justify-center shadow-md";
    
    const activeSubText = btn.querySelector('span:nth-child(2)');
    if(activeSubText) activeSubText.className = "block font-body-md text-body-md text-primary font-semibold";
    
    const activeRightIcon = btn.querySelector('.w-8');
    activeRightIcon.className = "w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm";
    activeRightIcon.innerHTML = '<span class="material-symbols-outlined text-xl" style="font-variation-settings: \'FILL\' 1;">check</span>';
  }

  function selectQuestions(btn) {
    const parent = btn.parentElement;
    const buttons = parent.getElementsByClassName('question-btn');
    for (let b of buttons) {
      b.className = "question-btn flex flex-col items-center justify-center p-space-md bg-surface-container-lowest rounded-xl shadow-sm transition-all duration-200 active:scale-95 text-center space-y-2";
      const circle = b.querySelector('.w-12');
      circle.className = "w-12 h-12 rounded-full bg-surface-container text-outline flex items-center justify-center";
      const label = b.querySelector('span:nth-child(2)');
      if(label) label.className = "block font-body-md text-body-md text-outline";
    }
    btn.className = "question-btn flex flex-col items-center justify-center p-space-md bg-primary-fixed/20 rounded-xl shadow-md transition-all duration-200 active:scale-95 ring-2 ring-primary text-center space-y-2";
    const activeCircle = btn.querySelector('.w-12');
    activeCircle.className = "w-12 h-12 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm";
    const activeLabel = btn.querySelector('span:nth-child(2)');
    if(activeLabel) activeLabel.className = "block font-body-md text-body-md text-primary font-semibold";
  }
</script></main></body></html>
