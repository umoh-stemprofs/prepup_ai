<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

</head><body class="bg-surface pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface flex-grow"><div class="flex flex-col w-full px-6 py-8 justify-center items-center">
<!-- Top Section: Logo & Titles -->
<div class="flex flex-col items-center text-center w-full mb-8">
<div class="w-20 h-20 rounded-2xl bg-surface-container-lowest shadow-md flex items-center justify-center mb-6 p-3">
<img class="w-full h-full object-contain" data-alt="A modern 3D glossy app logo representing education, school, and exam preparation, featuring a graduation cap and an open book with vibrant royal blue and subtle gold accents, high quality 3D render style, smooth rounded icon shape." src="https://lh3.googleusercontent.com/aida/AEtjO1XIE3mrjId-KDImjhwTeKgxsd5xw9rgpLcrJbaa1Pc_UB5xUnOphCz1Z9lDWFZdN2HTHSk8I1bphdVaJdd2P837NUAei8VRPxsfXJSkm04QLJi2cYX7BRuaYRyNLgYFsmcVTNuwuOGEYukKWd_FhFZAIdkf8Ai5jzPlgp4z9MuFRLz2TlPCrNqjepAuhyH9D3Lv7Ujj2y7AKP2nSKHYw0u1iUk_NPT86F9HZ_9Jg_OMx0ta1A_BlSAx1lI"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create Account</h1>
<p class="font-body-md text-on-surface-variant text-base font-normal">Fill in your details to start</p>
</div>
<!-- Form Fields -->
<div class="flex flex-col w-full gap-5 mb-8">
<!-- 1. Full Name -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-on-surface text-sm">Your Full Name</label>
<div class="w-full h-[60px] bg-surface-container-lowest rounded-2xl flex items-center px-5 shadow-sm" style="box-shadow: inset 0 0 0 2px #E2E8F0;">
<input class="w-full bg-transparent font-body-md text-on-surface outline-none placeholder:text-outline text-base font-normal" placeholder="Enter your full name" type="text"/>
</div>
</div>
<!-- 2. Email with requested error state -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-on-surface text-sm">Your Email</label>
<div class="w-full h-[60px] bg-surface-container-lowest rounded-2xl flex items-center px-5 shadow-sm" style="box-shadow: inset 0 0 0 2px #DC2626;">
<input class="w-full bg-transparent font-body-md text-on-surface outline-none text-base font-normal" type="email" value="student@prepup"/>
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<div class="flex items-center gap-1.5 px-1">
<span class="material-symbols-outlined text-error text-sm" style="font-variation-settings: 'FILL' 1;">info</span>
<span class="text-error text-xs font-semibold">Please write your email address here</span>
</div>
</div>
<!-- 3. Password -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-on-surface text-sm">Your Password</label>
<div class="w-full h-[60px] bg-surface-container-lowest rounded-2xl flex items-center px-5 shadow-sm" style="box-shadow: inset 0 0 0 2px #E2E8F0;">
<input class="w-full bg-transparent font-body-md text-on-surface outline-none text-base font-normal" id="password-input" type="password" value="secretpassword"/>
<button class="text-outline hover:text-on-surface transition-colors focus:outline-none" onclick="const p = document.getElementById('password-input'); p.type = p.type === 'password' ? 'text' : 'password';" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="w-full mb-6">
<button class="w-full h-[60px] bg-secondary text-on-secondary rounded-2xl flex items-center justify-center gap-3 shadow-md font-label-md text-lg active:scale-[0.99] transition-all">
<span>CREATE MY ACCOUNT</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- Secondary Navigation -->
<div class="flex items-center justify-center w-full">
<button class="font-label-md text-primary text-base py-2 px-4 hover:underline">
      Already have an account? Sign In
    </button>
</div>
</div></main></body></html>
